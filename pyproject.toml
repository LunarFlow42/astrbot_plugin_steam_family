[project]
name = "astrbot_plugin_steam_family"
version = "0.1.0"
description = "Steam 家庭资产监控与智能管家插件 for AstrBot"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "LunarFlow42" }
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "aiosqlite>=0.20.0",
    "jinja2>=3.1.0",
    "playwright>=1.40.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "agent"]
only-include = ["core", "agent", "config.py", "main.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
