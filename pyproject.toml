[project]
name = "astrbot_plugin_steam_family"
version = "0.3.0"
description = "Steam 家庭资产监控与智能管家插件 for AstrBot"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "LunarFlow42" }
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "aiosqlite>=0.20.0",
    "jinja2>=3.1.0",
    "protobuf>=5.29.0,<7",
    "qrcode[pil]>=8.0,<9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "agent"]
# assets/（卡片渲染模板）与 pages/（插件 WebUI 大盘页面）、metadata.yaml 必须随
# wheel 分发：缺失时构建产物中的卡片渲染会静默降级、插件卡片 UI 无法打开。
only-include = ["core", "agent", "assets", "pages", "config.py", "main.py", "metadata.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
